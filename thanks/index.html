}
.tick{

  display:flex; align-items:center; justify-content:center; margin:0 auto 22px;
  font-size:32px; color:var(--brand-dark); font-weight:700;
}
h1{font-size:28px; line-height:1.3; letter-spacing:-0.01em; margin:0 0 12px; color:var(--brand-dark)}
p{margin:0 0 10px; font-size:17px; color:var(--ink2)}
.back{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:48px; padding:0 26px; margin-top:24px; border-radius:12px;
  background:var(--brand); color:#fff; font-size:16px; font-weight:700; text-decoration:none;
